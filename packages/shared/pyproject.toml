[project]
name = "vap-shared"
version = "0.1.0"
description = "Shared schemas for the voice agent platform"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
